<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1390" viewBox="0 0 1400 1390" role="img" aria-labelledby="title description">
<title id="title">Зачем нужны шесть служебных регистров</title><desc id="description">Что хранится во время работы и что остаётся после её завершения</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243a} .arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}</style>
<rect width="1400" height="1390" fill="#f8fafc"/><rect width="1400" height="150" fill="#142236"/>
<text x="52" y="67" text-anchor="start" style="font-size:42px;fill:#ffffff;font-weight:700"><tspan x="52" dy="0">Зачем нужны шесть служебных регистров</tspan></text>
<text x="54" y="113" text-anchor="start" style="font-size:25px;fill:#cbd5e1;font-weight:400"><tspan x="54" dy="0">Что хранится во время работы и что остаётся после её завершения</tspan></text>
<text x="70" y="211" text-anchor="start" style="font-size:25px;fill:#475569;font-weight:700"><tspan x="70" dy="0">Название</tspan></text>
<text x="380" y="211" text-anchor="start" style="font-size:25px;fill:#475569;font-weight:700"><tspan x="380" dy="0">Зачем нужен</tspan></text>
<text x="1070" y="211" text-anchor="start" style="font-size:25px;fill:#475569;font-weight:700"><tspan x="1070" dy="0">После завершения</tspan></text>
<rect x="55" y="250" width="1290" height="140" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="700.0" y="348.14" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="331" text-anchor="start" style="font-size:32px;fill:#17243a;font-weight:700"><tspan x="82" dy="0">Задания</tspan></text>
<text x="380" y="310" text-anchor="start" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="380" dy="0">Время работы, объём удаления</tspan><tspan x="380" dy="35.1">и зафиксированные результаты.</tspan></text>
<rect x="1040" y="266" width="285" height="108" rx="20" fill="#effaf3" stroke="#8bb79c" stroke-width="2"/>
<text x="1182.5" y="312.065" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1182.5" dy="0">Остаётся</tspan><tspan x="1182.5" dy="31.05">Результаты работы</tspan></text>
<rect x="55" y="410" width="1290" height="140" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="700.0" y="508.14" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="491" text-anchor="start" style="font-size:32px;fill:#17243a;font-weight:700"><tspan x="82" dy="0">Ошибки</tspan></text>
<text x="380" y="470" text-anchor="start" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="380" dy="0">Причины, по которым некоторые</tspan><tspan x="380" dy="35.1">группы не удалось удалить.</tspan></text>
<rect x="1040" y="426" width="285" height="108" rx="20" fill="#effaf3" stroke="#8bb79c" stroke-width="2"/>
<text x="1182.5" y="472.065" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1182.5" dy="0">Остаётся</tspan><tspan x="1182.5" dy="31.05">История ошибок</tspan></text>
<rect x="55" y="570" width="1290" height="140" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="700.0" y="668.14" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="651" text-anchor="start" style="font-size:32px;fill:#17243a;font-weight:700"><tspan x="82" dy="0">Очередь</tspan></text>
<text x="380" y="630" text-anchor="start" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="380" dy="0">Команды работникам: что читать,</tspan><tspan x="380" dy="35.1">что удалять и когда остановиться.</tspan></text>
<rect x="1040" y="586" width="285" height="108" rx="20" fill="#fff7e8" stroke="#d8bd8c" stroke-width="2"/>
<text x="1182.5" y="632.065" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1182.5" dy="0">Очищается</tspan><tspan x="1182.5" dy="31.05">Команды не нужны</tspan></text>
<rect x="55" y="730" width="1290" height="140" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="700.0" y="828.14" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="811" text-anchor="start" style="font-size:32px;fill:#17243a;font-weight:700"><tspan x="82" dy="0">План</tspan></text>
<text x="380" y="790" text-anchor="start" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="380" dy="0">Готовый список того,</tspan><tspan x="380" dy="35.1">что нужно удалить вместе.</tspan></text>
<rect x="1040" y="746" width="285" height="108" rx="20" fill="#fff7e8" stroke="#d8bd8c" stroke-width="2"/>
<text x="1182.5" y="792.065" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1182.5" dy="0">Очищается</tspan><tspan x="1182.5" dy="31.05">Список не нужен</tspan></text>
<rect x="55" y="890" width="1290" height="140" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="700.0" y="988.14" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="971" text-anchor="start" style="font-size:32px;fill:#17243a;font-weight:700"><tspan x="82" dy="0">Узлы</tspan></text>
<text x="380" y="950" text-anchor="start" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="380" dy="0">Какие документы и записи</tspan><tspan x="380" dy="35.1">включены во временный список.</tspan></text>
<rect x="1040" y="906" width="285" height="108" rx="20" fill="#fff7e8" stroke="#d8bd8c" stroke-width="2"/>
<text x="1182.5" y="952.065" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1182.5" dy="0">Очищается</tspan><tspan x="1182.5" dy="31.05">Временные данные</tspan></text>
<rect x="55" y="1050" width="1290" height="140" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="700.0" y="1148.14" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="1131" text-anchor="start" style="font-size:32px;fill:#17243a;font-weight:700"><tspan x="82" dy="0">Связи</tspan></text>
<text x="380" y="1110" text-anchor="start" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="380" dy="0">Кто на что ссылается</tspan><tspan x="380" dy="35.1">в найденных данных.</tspan></text>
<rect x="1040" y="1066" width="285" height="108" rx="20" fill="#fff7e8" stroke="#d8bd8c" stroke-width="2"/>
<text x="1182.5" y="1112.0649999999998" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1182.5" dy="0">Очищается</tspan><tspan x="1182.5" dy="31.05">Временные данные</tspan></text>
<text x="700" y="1255" text-anchor="middle" style="font-size:25px;fill:#475569;font-weight:400"><tspan x="700" dy="0">Временные записи убираются после окончания работ;</tspan><tspan x="700" dy="33.75">часть списков очищается раньше — после обработки своей порции.</tspan></text>
<text x="700" y="1343" text-anchor="middle" style="font-size:25px;fill:#166534;font-weight:400"><tspan x="700" dy="0">Остановка тоже оставляет результаты и ошибки, а временное очищает.</tspan></text>
</svg>