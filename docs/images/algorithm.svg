<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1850" viewBox="0 0 1400 1850" role="img" aria-labelledby="title description">
<title id="title">Как Cutter3000 обрезает базу</title><desc id="description">Читает порциями, собирает связанные данные и удаляет их группами</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243a} .arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}</style>
<rect width="1400" height="1850" fill="#f8fafc"/><rect width="1400" height="150" fill="#142236"/>
<text x="52" y="67" text-anchor="start" style="font-size:42px;fill:#ffffff;font-weight:700"><tspan x="52" dy="0">Как Cutter3000 обрезает базу</tspan></text>
<text x="54" y="113" text-anchor="start" style="font-size:25px;fill:#cbd5e1;font-weight:400"><tspan x="54" dy="0">Читает порциями, собирает связанные данные и удаляет их группами</tspan></text>
<circle cx="70" cy="270.0" r="25" fill="#142236"/>
<text x="70" y="279.0" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">1</tspan></text>
<rect x="130" y="215" width="790" height="110" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="525.0" y="260.34" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="525.0" dy="0">Вы выбираете дату</tspan><tspan x="525.0" dy="37.800000000000004">и нажимаете «Начать обрезку»</tspan></text>
<circle cx="70" cy="435.0" r="25" fill="#142236"/>
<text x="70" y="444.0" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">2</tspan></text>
<rect x="130" y="380" width="790" height="110" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="525.0" y="425.34000000000003" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="525.0" dy="0">Обработка узнаёт, где в базе</tspan><tspan x="525.0" dy="37.800000000000004">могут находиться ссылки</tspan></text>
<path d="M525 325 V380" class="arrow"/>
<circle cx="70" cy="600.0" r="25" fill="#142236"/>
<text x="70" y="609.0" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">3</tspan></text>
<rect x="130" y="545" width="790" height="110" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="525.0" y="590.34" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="525.0" dy="0">Читает небольшую порцию старых</tspan><tspan x="525.0" dy="37.800000000000004">документов и записей</tspan></text>
<path d="M525 490 V545" class="arrow"/>
<circle cx="70" cy="765.0" r="25" fill="#142236"/>
<text x="70" y="774.0" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">4</tspan></text>
<rect x="130" y="710" width="790" height="110" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="525.0" y="755.34" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="525.0" dy="0">Находит связанные данные</tspan><tspan x="525.0" dy="37.800000000000004">и собирает их в группу для удаления</tspan></text>
<path d="M525 655 V710" class="arrow"/>
<circle cx="70" cy="930.0" r="25" fill="#142236"/>
<text x="70" y="939.0" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">5</tspan></text>
<rect x="130" y="875" width="790" height="110" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="525.0" y="920.34" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="525.0" dy="0">Сохраняет временный список:</tspan><tspan x="525.0" dy="37.800000000000004">что удалить и как это связано</tspan></text>
<path d="M525 820 V875" class="arrow"/>
<circle cx="70" cy="1095.0" r="25" fill="#142236"/>
<text x="70" y="1104.0" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">6</tspan></text>
<rect x="130" y="1040" width="790" height="110" rx="20" fill="#fff7e8" stroke="#d8bd8c" stroke-width="2"/>
<text x="525.0" y="1085.34" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="525.0" dy="0">Проверяет подготовленную группу</tspan><tspan x="525.0" dy="37.800000000000004">и пробует удалить её</tspan></text>
<path d="M525 985 V1040" class="arrow"/>
<rect x="970" y="545" width="370" height="235" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1155.0" y="605.62" text-anchor="middle" style="font-size:24px;fill:#17243a;font-weight:400"><tspan x="1155.0" dy="0">Сначала выбираются</tspan><tspan x="1155.0" dy="32.400000000000006">данные раньше даты.</tspan><tspan x="1155.0" dy="32.400000000000006"></tspan><tspan x="1155.0" dy="32.400000000000006">Связанные данные</tspan><tspan x="1155.0" dy="32.400000000000006">могут быть новее.</tspan></text>
<rect x="970" y="960" width="370" height="240" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="1155.0" y="994.44" text-anchor="middle" style="font-size:23px;fill:#17243a;font-weight:400"><tspan x="1155.0" dy="0">На сервере:</tspan><tspan x="1155.0" dy="31.05">пока эта группа</tspan><tspan x="1155.0" dy="31.05">удаляется, работники</tspan><tspan x="1155.0" dy="31.05">готовят следующую.</tspan><tspan x="1155.0" dy="31.05"></tspan><tspan x="1155.0" dy="31.05">В файловой базе</tspan><tspan x="1155.0" dy="31.05">работают по очереди.</tspan></text>
<path d="M970 1050 H942 V600 H920" class="arrow"/>
<text x="520" y="1204" text-anchor="middle" style="font-size:27px;fill:#475569;font-weight:400"><tspan x="520" dy="0">Повторяет для следующих порций</tspan></text>
<path d="M525 1150 V1172" class="arrow"/>
<path d="M525 1220 V1250" class="arrow"/>
<circle cx="70" cy="1315" r="25" fill="#142236"/>
<text x="70" y="1324" text-anchor="middle" style="font-size:26px;fill:#ffffff;font-weight:700"><tspan x="70" dy="0">7</tspan></text>
<rect x="130" y="1250" width="1210" height="130" rx="20" fill="#effaf3" stroke="#8bb79c" stroke-width="2"/>
<text x="735.0" y="1285.4199999999998" text-anchor="middle" style="font-size:29px;fill:#17243a;font-weight:400"><tspan x="735.0" dy="0">Когда все группы обработаны:</tspan><tspan x="735.0" dy="39.150000000000006">очищает временные списки и команды;</tspan><tspan x="735.0" dy="39.150000000000006">сохраняет результаты и ошибки</tspan></text>
<text x="700" y="1440" text-anchor="middle" style="font-size:24px;fill:#475569;font-weight:400"><tspan x="700" dy="0">Если одну группу удалить нельзя, ошибка сохраняется; другие группы продолжаются.</tspan></text>
<rect x="55" y="1520" width="1290" height="265" rx="20" fill="#fff1ef" stroke="#d5aaa4" stroke-width="2"/>
<text x="700.0" y="1680.64" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"></text>
<text x="82" y="1563" text-anchor="start" style="font-size:29px;fill:#9f352e;font-weight:700"><tspan x="82" dy="0">Если нажать «Остановить обрезку»</tspan></text>
<rect x="80" y="1605" width="330" height="115" rx="20" fill="#ffffff" stroke="#d5aaa4" stroke-width="2"/>
<text x="245.0" y="1653.53" text-anchor="middle" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="245.0" dy="0">Прекратить чтение</tspan><tspan x="245.0" dy="35.1">и новые удаления</tspan></text>
<path d="M410 1662 H485" class="arrow"/>
<rect x="485" y="1605" width="365" height="115" rx="20" fill="#ffffff" stroke="#d5aaa4" stroke-width="2"/>
<text x="667.5" y="1653.53" text-anchor="middle" style="font-size:26px;fill:#17243a;font-weight:400"><tspan x="667.5" dy="0">Дождаться конца</tspan><tspan x="667.5" dy="35.1">текущих удалений</tspan></text>
<path d="M850 1662 H925" class="arrow"/>
<rect x="925" y="1605" width="385" height="115" rx="20" fill="#ffffff" stroke="#d5aaa4" stroke-width="2"/>
<text x="1117.5" y="1653.875" text-anchor="middle" style="font-size:25px;fill:#17243a;font-weight:400"><tspan x="1117.5" dy="0">Очистить временное;</tspan><tspan x="1117.5" dy="33.75">оставить результаты</tspan></text>
<text x="700" y="1763" text-anchor="middle" style="font-size:23px;fill:#9f352e;font-weight:400"><tspan x="700" dy="0">То, что уже успешно удалено, остановка не восстанавливает.</tspan></text>
</svg>