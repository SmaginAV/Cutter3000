<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1550" viewBox="0 0 1400 1550" role="img" aria-labelledby="title description">
<title id="title">Что происходит при удалении группы</title><desc id="description">Изменения одной попытки либо подтверждаются вместе, либо отменяются</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#17243a} .arrow{fill:none;stroke:#64748b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}</style>
<rect width="1400" height="1550" fill="#f8fafc"/><rect width="1400" height="150" fill="#142236"/>
<text x="52" y="67" text-anchor="start" style="font-size:42px;fill:#ffffff;font-weight:700"><tspan x="52" dy="0">Что происходит при удалении группы</tspan></text>
<text x="54" y="113" text-anchor="start" style="font-size:25px;fill:#cbd5e1;font-weight:400"><tspan x="54" dy="0">Изменения одной попытки либо подтверждаются вместе, либо отменяются</tspan></text>
<rect x="310" y="210" width="780" height="105" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="700.0" y="252.84" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="700.0" dy="0">Работник берёт готовую группу</tspan><tspan x="700.0" dy="37.800000000000004">из регистра «План»</tspan></text>
<path d="M700 315 V370" class="arrow"/>
<rect x="310" y="370" width="780" height="130" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="700.0" y="425.34000000000003" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="700.0" dy="0">Проверяет, что нужные ссылки учтены</tspan><tspan x="700.0" dy="37.800000000000004">и список группы актуален</tspan></text>
<text x="700" y="551" text-anchor="middle" style="font-size:24px;fill:#475569;font-weight:400"><tspan x="700" dy="0">Для проверки временно составляет точный список записей этой группы.</tspan></text>
<path d="M700 500 V519" class="arrow"/>
<path d="M700 565 V585" class="arrow"/>
<rect x="310" y="585" width="780" height="105" rx="20" fill="#fff7e8" stroke="#d8bd8c" stroke-width="2"/>
<text x="700.0" y="646.41" text-anchor="middle" style="font-size:27px;fill:#17243a;font-weight:400"><tspan x="700.0" dy="0">Пробует удалить документы и записи группы</tspan></text>
<path d="M700 690 V745" class="arrow"/>
<polygon points="700,745 935,815 700,885 465,815" fill="#fff1d5" stroke="#d5b879" stroke-width="2"/>
<text x="700" y="824.0" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="700" dy="0">Удаление удалось?</tspan></text>
<path d="M465 815 H320 V925" class="arrow"/>
<text x="301" y="881" text-anchor="middle" style="font-size:28px;fill:#166534;font-weight:400"><tspan x="301" dy="0">Да</tspan></text>
<path d="M935 815 H1080 V925" class="arrow"/>
<text x="1068" y="881" text-anchor="middle" style="font-size:28px;fill:#9f352e;font-weight:400"><tspan x="1068" dy="0">Нет</tspan></text>
<rect x="60" y="925" width="520" height="270" rx="20" fill="#effaf3" stroke="#8bb79c" stroke-width="2"/>
<text x="320.0" y="986.92" text-anchor="middle" style="font-size:24px;fill:#17243a;font-weight:400"><tspan x="320.0" dy="0">Убрать выполненное из «Плана».</tspan><tspan x="320.0" dy="32.400000000000006">Обновить итог в «Заданиях».</tspan><tspan x="320.0" dy="32.400000000000006">После обработки порции</tspan><tspan x="320.0" dy="32.400000000000006">очистить её «Узлы» и «Связи».</tspan><tspan x="320.0" dy="32.400000000000006"></tspan><tspan x="320.0" dy="32.400000000000006">Подтвердить изменения вместе.</tspan></text>
<rect x="820" y="925" width="520" height="270" rx="20" fill="#fff1ef" stroke="#d5aaa4" stroke-width="2"/>
<text x="1080.0" y="986.92" text-anchor="middle" style="font-size:24px;fill:#17243a;font-weight:400"><tspan x="1080.0" dy="0">Вернуть изменения этой попытки.</tspan><tspan x="1080.0" dy="32.400000000000006">Сохранить причину в «Ошибках».</tspan><tspan x="1080.0" dy="32.400000000000006">Если группу удалить нельзя,</tspan><tspan x="1080.0" dy="32.400000000000006">оставить пометку в «Плане».</tspan><tspan x="1080.0" dy="32.400000000000006"></tspan><tspan x="1080.0" dy="32.400000000000006">Другие группы продолжаются.</tspan></text>
<path d="M320 1195 V1250 H700 V1290" class="arrow"/>
<path d="M1080 1195 V1250 H700" class="arrow"/>
<rect x="310" y="1290" width="780" height="100" rx="20" fill="#edf6ff" stroke="#abcbe4" stroke-width="2"/>
<text x="700.0" y="1349.24" text-anchor="middle" style="font-size:28px;fill:#17243a;font-weight:400"><tspan x="700.0" dy="0">Продолжить со следующей группой</tspan></text>
<text x="700" y="1456" text-anchor="middle" style="font-size:24px;fill:#475569;font-weight:400"><tspan x="700" dy="0">Зафиксированный счётчик растёт после подтверждения изменений.</tspan><tspan x="700" dy="32.400000000000006">При остановке следующая попытка удаления не начинается.</tspan></text>
</svg>